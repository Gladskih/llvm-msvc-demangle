name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - id: pins
        run: echo "sdk=$(node -p 'const pin = require("./upstream.json"); pin.emscriptenVersion + "-" + pin.emsdkCommit')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/emsdk
          key: demangle-sdk-${{ runner.os }}-${{ steps.pins.outputs.sdk }}
      - name: Verify release maintenance
        run: node --test test/release-assets.test.mjs test/upstream-release.test.mjs test/upstream-promotion.test.mjs test/registry-release.test.mjs
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run test:native
      - run: npm run test:differential
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Verify exact release tarball
        run: npm run pack:verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ github.sha }}
          if-no-files-found: error
          path: |
            *.tgz
            package.sha256
            pack-result.json
            dist/build-info.json

  consumers:
    needs: verify
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package-${{ github.sha }}
      - run: node scripts/test-tarball.mjs
